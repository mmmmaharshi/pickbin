PackageLocale: en-US
Publisher: mmmmaharshi
PackageName: pickbin
License: MIT
LicenseUrl: https://github.com/mmmmaharshi/pickbin/blob/main/LICENSE
ShortDescription: Pick the right binary from any GitHub release for your machine
Description: |
