    InstallerUrl: https://github.com/mmmmaharshi/pickbin/releases/download/v0.1.0/pickbin-windows-amd64.exe
    InstallerSha256: PLACEHOLDER_SHA256_WINDOWS_AMD64
    Scope: user
    Commands:
      - pickbin
  - Architecture: arm64
    InstallerType: portable
    InstallerUrl: https://github.com/mmmmaharshi/pickbin/releases/download/v0.1.0/pickbin-windows-arm64.exe
    InstallerSha256: PLACEHOLDER_SHA256_WINDOWS_ARM64
    Scope: user
    Commands:
      - pickbin
ReleaseNotesUrl: https://github.com/mmmmaharshi/pickbin/releases/tag/v0.1.0
